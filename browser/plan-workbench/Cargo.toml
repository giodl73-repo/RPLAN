[package]
name = "rplan-plan-workbench"
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false

[workspace]

[lib]
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "rplan-workbench-control"
path = "src/main.rs"

[dependencies]
rplan-core = { path = "../../crates/rplan-core" }
rplan-io = { path = "../../crates/rplan-io" }
rplan-audit = { path = "../../crates/rplan-audit" }
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.149"
wasm-bindgen = "=0.2.127"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
